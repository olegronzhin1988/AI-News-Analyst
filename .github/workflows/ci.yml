# ci.yaml file, github auto actions

name: CI
on: 
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"
      - name: Create .env
        run: |
          echo "GROQ_API_KEY=fake" >> .env
          echo "NEWS_API_KEY=fake" >> .env
          echo "OPENROUTER_API_KEY=fake" >> .env
          echo "GROQ_MODEL=llama-3.1-8b-instant" >> .env
          echo "OPENROUTER_MODEL=meta-llama/llama-3.1-8b-instruct:free" >> .env
          echo "PRIMARY_AI_PROVIDER=groq" >> .env
          echo "DATABASE_URL=sqlite+aiosqlite:///./test.db" >> .env
      - run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v